services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: queimadas
      POSTGRES_PASSWORD: queimadas
      POSTGRES_DB: queimadas
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U queimadas"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
