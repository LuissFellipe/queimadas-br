name: Atualizar mapa

# O INPE regrava o mensal do mês corrente uma vez por dia (perto do meio-dia
# de Brasília), então uma execução diária depois disso pega o dado do dia.
on:
  schedule:
    - cron: "0 17 * * *"
  workflow_dispatch:
  push:
    branches: [master]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: queimadas
          POSTGRES_PASSWORD: queimadas
          POSTGRES_DB: queimadas
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U queimadas"
          --health-interval 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      # O banco nasce vazio a cada execução: a carga é sempre a histórica
      # inteira, e o resultado não depende de estado guardado em lugar nenhum.
      - run: make ingest
      - run: make transform
      - run: make export
      - run: make docs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  publicar:
    needs: pipeline
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
